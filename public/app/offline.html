<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7E5848">
  <title>Minha Comissão — Sem internet</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #231b17;
      background: #f6f1eb;
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 460px);
      padding: 32px;
      text-align: center;
      border: 1px solid #e6ddd5;
      border-radius: 24px;
      background: #fffcf8;
    }
    h1 { margin: 12px 0 8px; font-size: 28px; }
    p { margin: 0 0 22px; color: #70615b; }
    button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 16px;
      color: white;
      background: #7e5848;
      font: inherit;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <div aria-hidden="true" style="font-size:52px">☁️</div>
    <h1>Você está sem internet</h1>
    <p>A versão Web não salva lançamentos offline. Conecte-se novamente para entrar e sincronizar seus dados com segurança.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
